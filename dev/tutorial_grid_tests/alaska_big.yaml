# CrocoDash case config -- alaska_big
#
# Oblique-Mercator swath following the arc of the Aleutian chain: SW corner on
# the southern tip of Kamchatka, SE corner on the Oregon coast, north edge past
# the Bering Strait into the Chukchi. The southern edge is pinned through
# 48 N / 160 W so ~1130 km of open North Pacific sits under the Alaska
# Peninsula, putting the Alaskan Stream, the Alaska Gyre and the Gulf of Alaska
# in the interior rather than against a boundary.
#
# The supergrid is built by alaska_grids.ipynb (geometry in omerc_swath.py) and
# is NOT expressible in this YAML schema, hence supergrid_path.
#
# SIZE: 594 x 269 = 0.16 M cells, median cell 7.8 km -- a true ~1/10 degree,
# matching alaska_small's 7.9 km. Getting there needs care: from_projection
# divides projected-plane spacing by the projection's scale factor, so handing
# it 7826 m produced 4.2 km cells (a 1/17 degree grid wearing a 1/10 degree
# label). The notebook now pre-multiplies by the measured median scale factor
# (1.871 here) and passes 14644 m instead.
#
# Run: crocodash create --config alaska_big.yaml

grid:
  supergrid_path: /glade/u/home/manishrv/documents/croc/dev/tutorial_grid_tests/alaska_grids/alaska_big/ocean_hgrid.nc
  name: alaska_big

topo:
  min_depth: 9.5
  source:
    type: dataset
    # The gallery's coarsened GEBCO (120 arcsec, ~3.7 km), not the full 15 arcsec
    # GEBCO_2024. Both domains cross the antimeridian, and for a seam-crossing
    # request mom6_forge's longitude_slicer returns the whole dataset by design,
    # so the full-resolution read came to 491,616,000 source points and xESMF's
    # ESMF backend died with "buffer is too small for requested array". The same
    # read against this file is ~7.7 M points. At ~2 source cells per model cell
    # it is also comfortably inside the 12x threshold below which a direct
    # regrid, rather than Cressman, is the recommended method.
    bathymetry_path: /glade/campaign/cgd/oce/projects/CROCODILE/workshops/2026/CrocoDash/data/gebco_2026/GEBCO_2026_coarse_x8.nc
    longitude_coordinate_name: lon
    latitude_coordinate_name: lat
    vertical_coordinate_name: elevation
    # Choose the regridding explicitly rather than letting diagnose_resolution()
    # pick. At ~37 source pixels per model cell it recommends Cressman + a
    # stats mask, and computing those weights died with a NetCDF HDF error while
    # writing the intermediate -- the seam-crossing read hands it the whole
    # global GEBCO array (lon=86400), which is far more than that path expects.
    # A direct xESMF regrid with the mask taken straight from the dataset is both
    # what we want here and cheap.
    depth_method: xesmf
    mask_method: dataset

vgrid:
  type: hyperbolic
  nk: 75
  ratio: 20.0

case:
  cesmroot: /glade/u/home/manishrv/work/installs/full_regional_cesm
  caseroot: /glade/u/home/manishrv/croc_cases/alaska_big
  inputdir: /glade/u/home/manishrv/scratch/croc_input/alaska_big
  compset: "GR_JRA"     # 1850_DATM%JRA_SLND_CICE_MOM6%REGIONAL_SROF_SGLC_SWAV -- CICE on
  machine: derecho
  project: ncgd0011
  atm_grid_name: TL319  # JRA needs TL319; T62 is the NYF grid

forcings:
  date_range: ["2018-06-01 00:00:00", "2018-08-15 00:00:00"]
  boundaries: [north, south, east, west]
  product_name: glorys
  function_name: get_glorys_data_from_rda
