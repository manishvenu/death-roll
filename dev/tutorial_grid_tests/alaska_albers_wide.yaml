# CrocoDash case config — Domain C: alaska_albers_wide
# EPSG:3338 (Alaska Albers) projected grid, wider/shorter box (~63.5-67N,
# 160-177.5W as last edited in the notebook) chosen to cover both the Seward
# Peninsula (Alaska side) and the Chukotka Peninsula (Russian side) of the
# Bering Strait, rather than just the eastern half. Same resolution_m
# (~5967m, matched to alaska_latlon's mean T-cell area) as alaska_albers.yaml.
#
# IMPORTANT: same caveat as alaska_albers.yaml — this grid was built via
# Grid.from_projection() and is NOT expressible natively in this YAML schema.
# Copy ~/dev/alaska_grids/alaska_albers_wide/ocean_hgrid.nc to Derecho and
# update supergrid_path below before this config will work.
#
# Run: crocodash create --config alaska_albers_wide.yaml

grid:
  supergrid_path: /glade/u/home/manishrv/documents/croc/dev/tutorial_grid_tests/alaska_grids_fixed/alaska_albers_wide/ocean_hgrid.nc
  name: alaska_albers_wide

topo:
  min_depth: 9.5
  source:
    type: flat
    depth: 3000.0

vgrid:
  type: uniform
  nk: 10   # small for a fast smoke test; raise once builds are confirmed clean

case:
  cesmroot: /glade/u/home/manishrv/work/installs/full_regional_cesm
  caseroot: /glade/u/home/manishrv/croc_cases/alaska_albers_wide
  inputdir: /glade/u/home/manishrv/scratch/croc_input/alaska_albers_wide_v2
  compset: "1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL_SROF_SGLC_SWAV_SESP"
  machine: casper
  project: ncgd0011
  atm_grid_name: T62   # NYF requires T62, not TL319 (which is for JRA)

forcings:
  date_range: ["2018-06-21 00:00:00", "2018-08-15 00:00:00"]   # summer 2018, ~8 weeks
  boundaries: [north, south, east, west]
  product_name: reference_ocean          # synthetic in-memory forcing, no download needed
  function_name: get_reference_ocean_data
