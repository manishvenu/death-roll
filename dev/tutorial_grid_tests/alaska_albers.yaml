# CrocoDash case config — Domain B: alaska_albers
# EPSG:3338 (Alaska Albers) projected grid, same 63-68N / 160-170W box as
# alaska_latlon.yaml, resolution matched to alaska_latlon's actual mean
# T-cell area (~5967m) rather than a naive degree->metre conversion.
#
# IMPORTANT: this domain was built via Grid.from_projection() in
# /Users/manishrv/dev/alaska_grids.ipynb, which CrocoDash's YAML loader does
# NOT support directly (recipe.py::build_grid only handles a plain lat/lon
# Grid(**cfg) or Grid.from_supergrid(path)). The supergrid file it produced,
# ~/dev/alaska_grids/alaska_albers/ocean_hgrid.nc, must be copied to Derecho
# (e.g. under /glade/...) and supergrid_path below updated to that path
# before this config will work.
#
# Run: crocodash create --config alaska_albers.yaml

grid:
  supergrid_path: /glade/u/home/manishrv/documents/croc/dev/tutorial_grid_tests/alaska_grids_fixed/alaska_albers/ocean_hgrid.nc
  name: alaska_albers

topo:
  min_depth: 9.5
  source:
    type: flat
    depth: 3000.0

vgrid:
  type: uniform
  nk: 10   # small for a fast smoke test; raise once builds are confirmed clean

case:
  cesmroot: /glade/u/home/manishrv/work/installs/full_regional_cesm
  caseroot: /glade/u/home/manishrv/croc_cases/alaska_albers
  inputdir: /glade/u/home/manishrv/scratch/croc_input/alaska_albers_v2
  compset: "1850_DATM%NYF_SLND_SICE_MOM6%REGIONAL_SROF_SGLC_SWAV_SESP"
  machine: casper
  project: ncgd0011
  atm_grid_name: T62   # NYF requires T62, not TL319 (which is for JRA)

forcings:
  date_range: ["2018-06-21 00:00:00", "2018-08-15 00:00:00"]   # summer 2018, ~8 weeks
  boundaries: [north, south, east, west]
  product_name: reference_ocean          # synthetic in-memory forcing, no download needed
  function_name: get_reference_ocean_data
